<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0F1C" />
  <title>LINGO — Offline</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0A0F1C;
      color: #F1F5F9;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    main {
      max-width: 320px;
    }
    h1 {
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 4px;
      color: #00D4AA;
      margin: 0 0 12px;
    }
    p {
      color: #94A3B8;
      font-size: 14px;
      line-height: 1.55;
      margin: 0;
    }
    .hint {
      margin-top: 16px;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #64748B;
    }
  </style>
</head>
<body>
  <main>
    <h1>LINGO</h1>
    <p>You're offline. Translation requires an internet connection.</p>
    <p class="hint">Reconnect to continue</p>
  </main>
</body>
</html>
